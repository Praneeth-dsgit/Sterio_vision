<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stereo Vision</title>
  <link rel="stylesheet" href="/static/css/app.css?v=headlock7" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">SV</span>
        <div>
          <h1>Stereo Vision</h1>
          <p>Dual-cam live feed · Meta Quest 3</p>
        </div>
      </div>

      <div class="toolbar">
        <button id="btn-vr" class="btn primary">Enter VR</button>
        <button id="btn-record" class="btn danger">Start recording</button>
        <button id="btn-swap" class="btn">Swap eyes</button>
        <div class="recordings-menu">
          <button id="btn-recordings" class="btn" type="button">Saved recordings ▾</button>
          <div id="recordings-panel" class="recordings-panel" hidden>
            <ul id="recording-list"></ul>
          </div>
        </div>
      </div>

      <div class="status-pills">
        <span id="pill-link" class="pill">Connecting</span>
        <span id="pill-rec" class="pill">Idle</span>
      </div>
    </header>

    <p class="hint" id="vr-hint">Quest 3: open this page over HTTPS, then tap Enter VR.</p>

    <section class="stage">
      <div class="eye-card">
        <div class="eye-meta"><span id="left-eye-tag">LEFT</span><span id="left-cam-label">cam 0</span></div>
        <canvas id="left-canvas"></canvas>
      </div>
      <div class="eye-card">
        <div class="eye-meta"><span id="right-eye-tag">RIGHT</span><span id="right-cam-label">cam 1</span></div>
        <canvas id="right-canvas"></canvas>
      </div>
      <div id="overlay-msg" class="overlay-msg">Waiting for synced frames…</div>
    </section>
  </div>

  <div id="vr-root"></div>

  <script src="/static/js/xr-shim.js?v=headlock7"></script>
  <script src="/static/vendor/three.min.js"></script>
  <script src="/static/js/protocol.js?v=headlock7"></script>
  <script src="/static/js/stream.js?v=headlock7"></script>
  <script src="/static/js/vr.js?v=headlock7"></script>
  <script src="/static/js/app.js?v=headlock7"></script>
</body>
</html>
