# Stereo Vision — dual USB camera → Meta Quest 3
# Edit this file or change settings from the web UI.

cameras:
  left_index: 0
  right_index: 1
  width: 1280
  height: 720
  fps: 30
  # MJPG is required on USB to run two cameras without bandwidth collapse
  fourcc: MJPG
  # Horizontal FOV of the USB lens, from the datasheet (typical 720p webcam ~60–78°).
  # Used for the live angle grid. Vertical FOV is derived from the frame aspect ratio.
  hfov_deg: 70
  # Flip if a camera is mounted upside down
  left_flip: none    # none | h | v | hv
  right_flip: none

stream:
  jpeg_quality: 85
  # Send full capture width to the live windows (0 = never downscale)
  max_width: 1920
  # Drop a pair if left/right timestamps differ by more than this
  max_skew_ms: 40

server:
  host: 0.0.0.0
  http_port: 8080
  https_port: 8443
  # WebXR on Quest 3 requires HTTPS
  https: true

record:
  # Start writing to disk as soon as cameras are live
  auto_start: false
  directory: recordings
  # New file every N minutes (0 = one file until Stop)
  segment_minutes: 5
  # Crash-safe fragmented MP4 of the side-by-side stereo pair
  stereo_layout: sbs   # sbs | tb
  # Encode scale (1.0 = full 1280x720/eye). 0.75 keeps motion smooth on Jetson CPU.
  scale: 0.75
  # Capture USB camera mic into the MP4 (AAC). On Jetson uses arecord/ffmpeg+ALSA.
  # If auto misses it: arecord -l  then set e.g. audio_device: plughw:1,0
  audio: true
  audio_device: auto  # auto | off | default | pulse | plughw:1,0
